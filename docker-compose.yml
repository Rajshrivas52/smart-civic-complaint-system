version: '3.8'

services:
  mongodb:
    image: mongo:7
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: smart_civic_db

  backend:
    build: ./backend
    restart: always
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/smart_civic_db
      - JWT_SECRET=${JWT_SECRET:-smart_civic_jwt_secret_2026}
      - JWT_EXPIRES_IN=7d
      - CLIENT_URL=http://localhost:5173
      - AI_SERVICE_URL=http://ai-service:8000
    depends_on:
      - mongodb
      - ai-service

  frontend:
    build: ./frontend
    restart: always
    ports:
      - '5173:80'
    depends_on:
      - backend

  ai-service:
    build: ./ai-service
    restart: always
    ports:
      - '8000:8000'
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - BACKEND_URL=http://backend:5000/api

volumes:
  mongo-data:
